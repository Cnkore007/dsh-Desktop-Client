[package]
name = "deepseek-harness-desktop-client"
version = "1.0.0"
description = "DeepSeek Harness Desktop Client — a modern desktop client for DeepSeek Harness"
authors = ["DeepSeek Harness Desktop Client contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_harness_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
