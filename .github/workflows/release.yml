name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle_args: --bundles "app,dmg"
          - os: macos-13
            target: x86_64-apple-darwin
            bundle_args: --bundles "app,dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles "deb,appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install Rust (target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install frontend deps
        run: npm ci

      - name: Prepare runtime (node + @deepseek-ai/dsh)
        run: npm run setup

      - name: Build
        run: npx tauri build ${{ matrix.bundle_args }} -- --locked

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          DIST_DIR="$(pwd)/dist"
          if [ "${{ runner.os }}" = "macOS" ]; then
            find src-tauri/target/release/bundle -name "*.dmg" -exec cp {} "$DIST_DIR/" \; 2>/dev/null || true
            if [ -d "src-tauri/target/release/bundle/macos" ]; then
              (cd src-tauri/target/release/bundle/macos && zip -r "$DIST_DIR/DeepSeek-Harness-Desktop-Client_${{ matrix.target }}.zip" *.app) 2>/dev/null || true
            fi
          elif [ "${{ runner.os }}" = "Windows" ]; then
            find src-tauri/target/release/bundle -name "*.exe" -exec cp {} "$DIST_DIR/" \; 2>/dev/null || true
            find src-tauri/target/release/bundle -name "*.msi" -exec cp {} "$DIST_DIR/" \; 2>/dev/null || true
          else
            find src-tauri/target/release/bundle -name "*.deb" -exec cp {} "$DIST_DIR/" \; 2>/dev/null || true
            find src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} "$DIST_DIR/" \; 2>/dev/null || true
          fi
          test -n "$(ls -A dist)" || { echo "ERROR: no artifacts produced"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum * > SHA256SUMS.txt)
          elif command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          fi
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-desktop-${{ matrix.os }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 仅此 job 需要写 Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**
          generate_release_notes: true
