name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle_args: --bundles app
          - os: macos-13
            target: x86_64-apple-darwin
            bundle_args: --bundles app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend deps
        run: npm install

      - name: Prepare runtime (node + @deepseek-ai/dsh + clipboard patch)
        run: npm run prepare

      - name: Build
        run: npx tauri build ${{ matrix.bundle_args }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R src-tauri/target/release/bundle/macos/*.app dist/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/macos/*.dmg dist/ 2>/dev/null || true
          else
            cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          fi
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
