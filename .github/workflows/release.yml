name: Release

on:
  push:
    tags:
      - "v*"

# 审计 H8：permissions 按 job 最小化 —— build 只需读代码与上传 artifact，
# 仅 release job 需要 contents: write（写 GitHub Release）。
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle_args: --bundles "app,dmg"
          - os: macos-13
            target: x86_64-apple-darwin
            bundle_args: --bundles "app,dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      # 审计 H8：第三方 actions 按 commit SHA 钉死（Dependabot 自动更新 SHA）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (target)
        # 移动 tag，仅安装工具链，无仓库权限；保持 @stable 以持续获得 Rust 更新
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install frontend deps
        run: npm ci

      # 审计 SC-01：原 release.yml 调用了不存在的 npm run prepare，
      # 正式版改为 npm run setup（fetch:node + prepare:runtime）。
      - name: Prepare runtime (node + @deepseek-ai/dsh)
        run: npm run setup

      # 审计 SC-08：--locked 确保按已提交的 Cargo.lock 构建
      - name: Build
        run: npx tauri build --locked ${{ matrix.bundle_args }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp src-tauri/target/release/bundle/macos/*.app dist/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/dmg/*.dmg dist/ 2>/dev/null || true
          else
            cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          fi
          # 产物存在性断言（审计 M9：移除静默失效的 || true 路径）
          test -n "$(ls -A dist)" || { echo "ERROR: no artifacts produced"; exit 1; }
          # 审计 H9：随产物附 SHA256SUMS，供用户校验下载完整性
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-desktop-${{ matrix.os }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 仅此 job 需要写 Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**
          generate_release_notes: true
